[project]
name = "moneyfast-api"
version = "0.1.0"
description = "FastAPI backend for MoneyFast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.1",
  "email-validator>=2.2.0",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "pydantic-settings>=2.10.1",
  "python-jose[cryptography]>=3.5.0",
  "pwdlib[argon2]>=0.2.1",
  "psycopg[binary]>=3.2.0,<4",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
  "tzdata>=2026.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.16.9",
]

# Lint/format apply to the T-001 foundation code only; legacy modules are not reformatted here.
[tool.ruff]
line-length = 120
target-version = "py312"
include = [
  "app/core/config/**/*.py",
  "app/core/context/**/*.py",
  "app/core/db/**/*.py",
  "app/core/errors/**/*.py",
  "app/core/logging/**/*.py",
  "app/core/time/**/*.py",
  "app/core/database.py",
  "app/core/security/**/*.py",
  "app/modules/**/*.py",
  "app/shared/**/*.py",
  "app/api/system.py",
  "app/main.py",
  "tests/pg_env.py",
  "tests/conftest.py",
  "tests/test_t001_foundation.py",
  "tests/test_t002_identity.py",
  "tests/test_t002_tenant_login.py",
  "tests/test_t002_google.py",
  "tests/test_t003_organization.py",
  "tests/test_t004_customers.py",
  "tests/test_t005_engine.py",
  "tests/test_t005_credit_products.py",
  "tests/test_t005_races.py",
  "tests/test_t006_origination.py",
  "tests/test_t007_disbursement.py",
  "tests/test_t008_payments.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.modules.identity.deps.require_permission"]

[tool.ruff.lint.per-file-ignores]
"tests/test_t00[0-9]_*.py" = ["F811"]  # pytest fixture re-use via import
"tests/test_t005_credit_products.py" = ["E501"]  # long inline SQL literals
"tests/test_t005_races.py" = ["E501"]  # long inline SQL literals
"tests/test_t006_origination.py" = ["E501", "E731"]  # inline SQL literals, small test lambdas
"app/modules/origination/models.py" = ["E501"]  # long inline SQL (immutability trigger functions)
"app/modules/loans/*.py" = ["E501"]  # long inline SQL and messages
"app/modules/cash/port.py" = ["E501"]  # long BLOCKED_BY_EVIDENCE message
"tests/test_t007_disbursement.py" = ["E501", "E731"]  # inline SQL literals
"tests/test_t008_payments.py" = ["E501", "E731"]  # inline SQL literals
