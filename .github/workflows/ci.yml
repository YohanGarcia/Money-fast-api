name: API CI

on:
  push:
    branches: [main, "codex/**", "refactor/**", "feat/**"]
  pull_request:
    branches: [main, "refactor/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneyfast
          POSTGRES_PASSWORD: moneyfast
          POSTGRES_DB: moneyfast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U moneyfast -d moneyfast_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      # PostgreSQL only (ADR-003). The test database name must end in _test.
      DATABASE_URL: postgresql+psycopg://moneyfast:moneyfast@localhost:5432/moneyfast_test
      TEST_DATABASE_URL: postgresql+psycopg://moneyfast:moneyfast@localhost:5432/moneyfast_test
      SECRET_KEY: ci-only-secret-key-for-github-actions-0123456789
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Alembic upgrade on PostgreSQL
        run: uv run alembic upgrade head
      - name: Validate Alembic schema consistency
        run: uv run alembic check
      - name: Alembic downgrade and re-upgrade
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run API tests (PostgreSQL only, includes the engine guard)
        run: uv run python -m pytest -q
